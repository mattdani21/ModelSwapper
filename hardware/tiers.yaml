# Per-tier hardware + residency policy (MASTER-PROMPT.md §1.3).
# One runtime everywhere; only the residency policy changes.
# Phase 0/1 dev machine = T4 (8 GB Apple M3) — numbers measured there are T4-class.

tiers:
  T0:
    hardware: "MacBook 24 GB"
    total_ram_gb: 24
    resident: "1 specialist (14B class, quantized) + router"
    policy: "aggressive swap"
    swap_targets: {warm_s: 3.0, cold_s: 8.0}
    peak_memory_ceiling_gb: 20
  T1:
    hardware: "Mac mini 48 GB"
    total_ram_gb: 48
    resident: "2 specialists resident, or 1 larger (32B class); swap the third"
    policy: "balanced"
    peak_memory_ceiling_gb: 40
  T2:
    hardware: "Mac Studio 192 GB"
    total_ram_gb: 192
    resident: "full pipeline resident; swap only for overflow/special cases"
    policy: "resident"
    peak_memory_ceiling_gb: 170
  T3:
    hardware: "Cluster / 1 TB VRAM"
    total_ram_gb: 1024
    resident: "fleet: N pipelines in parallel, shared weight store"
    policy: "fleet"
  T4:
    hardware: "Edge (phone/NAS/embedded); dev machine = Apple M3 8 GB"
    total_ram_gb: 8
    resident: "single specialist at a time, minimal router"
    policy: "aggressive swap"
    peak_memory_ceiling_gb: 6.5
    measured: true
    max_specialist: "4B class at Q4 (measured: 8B Q4_K_M fails Metal allocation on 8 GB; 4B Q4_K_M runs at ~1.5-1.7 GB RSS)"
    note: "the long-term moat — hyperscalers cannot follow here"
